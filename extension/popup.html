<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visual Zoom</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1>Visual Zoom</h1>
  </header>
  <p id="status" class="status" role="status">Loading&hellip;</p>
  <section id="controls" class="controls">
    <div class="scale-row">
      <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">&#8722;</button>
      <output id="scale">100%</output>
      <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
    </div>
    <input id="slider" type="range" min="30" max="300" step="1" value="100"
      aria-label="Zoom level slider">
    <button id="reset" type="button" class="reset" title="Reset to 100%">Reset to 100%</button>
  </section>
  <section id="site-section" class="site-section" hidden>
    <h2 id="site-name" class="site-name"></h2>
    <label class="toggle">
      <input id="site-enabled" type="checkbox">
      <span>Enable visual zoom for this site</span>
    </label>
    <label class="toggle">
      <input id="site-memory" type="checkbox">
      <span>Remember zoom for this site</span>
    </label>
  </section>
  <footer class="popup-footer">
    <button id="open-options" type="button" class="link">Settings</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
